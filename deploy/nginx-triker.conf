# Snippet de nginx para Triker
# Incluir dentro del server block de angelgf.com.es:
#   include /etc/nginx/snippets/triker.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── SignalR WebSocket ────────────────────────────────────────────────────
location /trikerapi/gamehub {
    proxy_pass         http://127.0.0.1:55001/gamehub;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 3600s;
}

# ── API REST ────────────────────────────────────────────────────────────
location /trikerapi/ {
    proxy_pass         http://127.0.0.1:55001/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   Connection        keep-alive;
    proxy_read_timeout 60s;
}

# ── Blazor WASM: framework (caché larga) ────────────────────────────────
location ^~ /triker/_framework/ {
    root /var/www;
    add_header Cache-Control "public, max-age=604800, immutable";
    gzip_static on;
}

# ── Blazor WASM: estáticos ───────────────────────────────────────────────
location ~* ^/triker/.+\.(css|js|png|ico|svg|woff2?)$ {
    root /var/www;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
}

# ── SPA ──────────────────────────────────────────────────────────────────
location /triker/ {
    root /var/www;
    try_files $uri /triker/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location = /triker {
    return 301 /triker/;
}
