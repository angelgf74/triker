# Snippet de nginx para Triker — se incluye dentro del server{} block:
#   include /apps/triker/nginx-triker.conf;
# Tras cualquier cambio recargar nginx:
#   nginx -s reload
# NOTA: $connection_upgrade NO se usa aquí porque requeriría un bloque map{}
# en el http{} de nginx.conf. En su lugar se usa el valor literal "upgrade".

# ── SignalR WebSocket ────────────────────────────────────────────────────────
location /trikerapi/gamehub {
    proxy_pass         http://127.0.0.1:55001/gamehub;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 3600s;
}

# ── API REST ─────────────────────────────────────────────────────────────────
location /trikerapi/ {
    proxy_pass         http://127.0.0.1:55001/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   Connection        keep-alive;
    proxy_read_timeout 60s;
}

# ── Blazor _framework (caché inmutable) ──────────────────────────────────────
location ^~ /triker/_framework/ {
    alias /apps/triker/app/_framework/;
    add_header Cache-Control "public, max-age=604800, immutable";
    gzip_static on;
}

# ── Estáticos con caché ──────────────────────────────────────────────────────
location ~* ^/triker/(.+\.(css|js|png|ico|svg|woff2?))$ {
    alias /apps/triker/app/$1;
    add_header Cache-Control "public, max-age=86400";
}

# ── SPA ──────────────────────────────────────────────────────────────────────
location /triker/ {
    alias /apps/triker/app/;
    try_files $uri $uri/ /triker/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location = /triker {
    return 301 /triker/;
}
