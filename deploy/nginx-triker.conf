# Triker nginx config — subdominios independientes
# Colocar en /etc/nginx/conf.d/triker.conf
# Tras cualquier cambio: nginx -t && systemctl reload nginx
# SSL lo gestiona certbot (añade los bloques listen 443 ssl automáticamente)

# ── API: triker-api.angelgf.com.es ───────────────────────────────────────────
server {
    listen 80;
    server_name triker-api.angelgf.com.es;

    # SignalR WebSocket
    location /gamehub {
        proxy_pass         http://127.0.0.1:55001/gamehub;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 3600s;
    }

    # API REST
    location / {
        proxy_pass         http://127.0.0.1:55001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        keep-alive;
        proxy_read_timeout 60s;
    }
}

# ── App: triker-app.angelgf.com.es ───────────────────────────────────────────
server {
    listen 80;
    server_name triker-app.angelgf.com.es;
    root /var/www/triker;

    # Blazor _framework (caché inmutable)
    location ^~ /_framework/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        gzip_static on;
    }

    # Estáticos con caché
    location ~* \.(css|js|png|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
