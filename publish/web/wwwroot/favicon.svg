<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Card body -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="#1a1a2e"/>
  <!-- Gold border -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#f0c040" stroke-width="2"/>
  <!-- Top-left corner mark -->
  <text x="4.5" y="10" font-family="'Arial Black',Arial,sans-serif" font-size="7.5" font-weight="900" fill="#f0c040">T</text>
  <text x="4" y="16.5" font-family="Arial,sans-serif" font-size="6" fill="#f0c040">★</text>
  <!-- Centre star -->
  <path d="M16 7 l1.8 5.5 h5.8 l-4.7 3.4 1.8 5.5L16 18l-4.7 3.4 1.8-5.5-4.7-3.4h5.8z" fill="#f0c040"/>
  <!-- Bottom-right corner mark (rotated) -->
  <text x="27.5" y="22" font-family="'Arial Black',Arial,sans-serif" font-size="7.5" font-weight="900" fill="#f0c040" text-anchor="middle" transform="rotate(180 27.5 24.5)">T</text>
  <text x="28" y="28" font-family="Arial,sans-serif" font-size="6" fill="#f0c040" text-anchor="middle" transform="rotate(180 28 29)">★</text>
</svg>
