<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full background fill — required for maskable purpose -->
  <rect width="512" height="512" fill="#1a1a2e"/>
  <!-- Card shape — content within 80% safe zone (> 51 px from each edge) -->
  <rect x="72" y="56" width="368" height="400" rx="32" fill="#0d0d22" stroke="#f0c040" stroke-width="7"/>
  <!-- Giant T centred on the card -->
  <text x="256" y="256"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="280" font-weight="900"
        fill="#f0c040"
        text-anchor="middle"
        dominant-baseline="central">T</text>
</svg>
